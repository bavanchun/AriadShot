name: Bug
description: Something is broken (a crash, an error, lost data) independent of MacShot parity.
labels: ["type:fix"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of ariadshot-daemon --version.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution or macOS version, desktop or compositor and its version, display scale.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output with QT_LOGGING_RULES="ariadshot.*=true". Remove file paths and anything personal.
      render: text
