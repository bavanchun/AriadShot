# Licence information for files that cannot carry an SPDX header. Every other file has its own header.
version = 1

[[annotations]]
path = [
    "tests/golden/**",
    "**.json",
    "**.jsonl",
    ".github/pull_request_template.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The AriadShot Authors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [
    "third_party/fonts/inter/*.ttf",
    "third_party/fonts/inter/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "third_party/fonts/noto-color-emoji/NotoColorEmoji.ttf",
    "third_party/fonts/noto-color-emoji/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Google Inc."
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "third_party/tl-expected/tl/expected.hpp",
    "third_party/tl-expected/LICENSE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Sy Brand"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
    "tests/scripts/imgdiff-cases/*.png",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The AriadShot Authors"
SPDX-License-Identifier = "GPL-3.0-only"

# These documents quote SPDX tags in their text; "override" keeps REUSE from reading those quotes as licence tags.
[[annotations]]
path = [
    "docs/prd.md",
    "docs/spec/13-build-ci-release.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 The AriadShot Authors"
SPDX-License-Identifier = "GPL-3.0-only"
